id: invoice-line
type: entity
title: Invoice line
status: stable

description: >
  One billed line for one service period. The grain at which billed revenue
  exists, the source of consumption history, and the bridge to recognised
  revenue.

grain: One row per invoice line per service period. A single annual invoice
  covering twelve months is one row unless the source system splits it.

properties:
  - name: invoice_line_id
    type: string
    required: true
  - name: invoice_id
    type: string
    required: true
  - name: contract_line_id
    type: string
    required: false
    references: contract-line
    description: >
      Null for usage billed with no contract line, which is common in self-serve.
  - name: party_id
    type: string
    required: true
    references: party
  - name: issue_date
    type: date
    required: true
  - name: service_period_start
    type: date
    required: true
    description: >
      The period the line pays for, not the period it was issued in. These differ
      for any prepaid or arrears billing, and the difference is what separates
      the billed basis from the recognised basis.
  - name: service_period_end
    type: date
    required: true
  - name: amount
    type: decimal
    required: true
    description: Net of tax. See the tax convention.
  - name: currency
    type: string
    required: true
  - name: fx_rate
    type: decimal
    required: false
    required_when: d-fx-treatment != single-currency
  - name: fx_rate_date
    type: date
    required: false
    required_when: d-fx-treatment != single-currency
  - name: is_usage
    type: boolean
    required: true
    description: >
      Marks consumption-based lines. The trailing history that
      d-usage-recurring-basis reads is built from these rows; no separate usage
      entity exists.
  - name: is_recurring
    type: boolean
    required: true
  - name: credit_note_of
    type: string
    required: false
    description: >
      Points at the invoice line this reverses. Credits must net against the
      original service period, not the period the credit was issued, or churn
      and contraction land in the wrong month.

read_by_decisions:
  - d-revenue-basis
  - d-non-recurring-revenue
  - d-fx-treatment
  - d-usage-recurring-basis

pitfalls:
  - >
    Using `issue_date` where `service_period_start` is meant collapses the billed
    and recognised bases into each other and makes annual prepay look like a
    twelve-fold spike.
  - >
    Consumption history assembled without netting credit notes overstates the
    floor under every option of d-usage-recurring-basis.
